declaration:
  call: declare
  version: 0.1
  description: "Delete vault secrets for LLM connection"
  method: post
  accepts: json
  returns: json
  namespace: rag-search
  allowlist:
    body:
      - field: vaultUuid
        type: string
        description: "Body field 'vaultUuid' - stable UUID for vault path"
      - field: llmPlatform
        type: string
        description: "Body field 'llmPlatform'"
      - field: llmModel
        type: string
        description: "Body field 'llmModel'"
      - field: embeddingModel
        type: string
        description: "Body field 'embeddingModel'"
      - field: embeddingPlatform
        type: string
        description: "Body field 'embeddingPlatform'"
      - field: deploymentEnvironment
        type: string
        description: "Body field 'deploymentEnvironment'"
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

extract_request_data:
  assign:
    vaultUuid: ${incoming.body.vaultUuid}
    llmPlatform: ${incoming.body.llmPlatform}
    llmModel: ${incoming.body.llmModel}
    embeddingModel: ${incoming.body.embeddingModel}
    embeddingPlatform: ${incoming.body.embeddingPlatform}
    deploymentEnvironment: ${incoming.body.deploymentEnvironment}
    cookie: ${incoming.headers.cookie}
  next: check_connection_exists

check_connection_exists:
  call: http.post
  args:
    url: "[#RAG_SEARCH_RESQL]/get-llm-connection-by-vault-uuid"
    body:
      vault_uuid: ${vaultUuid}
  result: connection_result
  next: validate_connection_response

validate_connection_response:
  switch:
    - condition: ${connection_result.response.body && connection_result.response.body.length > 0}
      next: execute_delete_request
  next: assign_connection_not_found_error

execute_delete_request:
  call: http.post
  args:
    url: "[#RAG_SEARCH_CRON_MANAGER]/execute/delete_from_vault/delete_secrets"
    query:
      cookie: ${incoming.headers.cookie.replace('customJwtCookie=','')} #Removing the customJwtCookie phrase from payload to to send cookie token only
      vaultUuid: ${vaultUuid}
      llmPlatform: ${llmPlatform}
      llmModel: ${llmModel}
      embeddingModel: ${embeddingModel}
      embeddingPlatform: ${embeddingPlatform}
  result: cron_delete_res
  next: return_delete_ok

assign_validation_error:
  assign:
    validation_error_res: {
      message: 'Required fields missing: vaultUuid, llmPlatform, llmModel, and deploymentEnvironment are required',
      operationSuccessful: false,
      statusCode: 400
    }
  next: return_validation_error

assign_connection_not_found_error:
  assign:
    connection_not_found_res: {
      message: 'Connection not found with the provided vaultUuid',
      operationSuccessful: false,
      statusCode: 404
    }
  next: return_connection_not_found

assign_fail_response:
  assign:
    format_bad_res: {
      message: 'Platform not supported. Supported platforms: aws, azure',
      operationSuccessful: false,
      statusCode: 400
    }
  next: return_bad_request

return_delete_ok:
  status: 200
  return: "Executed cron manager successfully to delete secrets from vault"
  next: end

return_validation_error:
  status: 400
  return: ${validation_error_res}
  next: end

return_connection_not_found:
  status: 404
  return: ${connection_not_found_res}
  next: end

return_bad_request:
  status: 400
  return: ${format_bad_res}
  next: end
