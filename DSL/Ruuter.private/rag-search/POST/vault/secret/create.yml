declaration:
  call: declare
  version: 0.1
  description: "Insert model metadata"
  method: post
  accepts: json
  returns: json
  namespace: rag-search
  allowlist:
    body:
      - field: vaultUuid
        type: string
        description: "Body field 'vaultUuid' - stable UUID for vault path"
      - field: llmPlatform
        type: string
        description: "Body field 'llmPlatform'"
      - field: llmModel
        type: array
        description: "Body field 'llmModel'"
      - field: secretKey
        type: string
        description: "Body field 'secretKey'"
      - field: accessKey
        type: string
        description: "Body field 'accessKey'"
      - field: deploymentName
        type: string
        description: "Body field 'deploymentName'"
      - field: targetUrl
        type: string
        description: "Body field 'targetUrl'"
      - field: apiKey
        type: string
        description: "Body field 'apiKey'"
      - field: embeddingModel
        type: string
        description: "Body field 'embeddingModel'"
      - field: embeddingPlatform
        type: string
        description: "Body field 'embeddingPlatform'"
      # Embedding AWS Bedrock credentials
      - field: embeddingAccessKey
        type: string
        description: "Body field 'embeddingAccessKey'"
      - field: embeddingSecretKey
        type: string
        description: "Body field 'embeddingSecretKey'"
      # Embedding Azure credentials
      - field: embeddingDeploymentName
        type: string
        description: "Body field 'embeddingDeploymentName'"
      - field: embeddingTargetUri
        type: string
        description: "Body field 'embeddingTargetUri'"
      - field: embeddingAzureApiKey
        type: string
        description: "Body field 'embeddingAzureApiKey'"
      - field: deploymentEnvironment
        type: string
        description: "Body field 'deploymentEnvironment'"
    headers:
      - field: cookie
        type: string
        description: "Cookie field"

extract_request_data:
  assign:
    vaultUuid: ${incoming.body.vaultUuid}
    llmPlatform: ${incoming.body.llmPlatform}
    llmModel: ${incoming.body.llmModel}
    secretKey: ${incoming.body.secretKey}
    accessKey: ${incoming.body.accessKey}
    deploymentName: ${incoming.body.deploymentName}
    targetUrl: ${incoming.body.targetUrl}
    apiKey: ${incoming.body.apiKey}
    embeddingModel: ${incoming.body.embeddingModel}
    embeddingPlatform: ${incoming.body.embeddingPlatform}
    # Embedding AWS Bedrock credentials
    embeddingAccessKey: ${incoming.body.embeddingAccessKey}
    embeddingSecretKey: ${incoming.body.embeddingSecretKey}
    # Embedding Azure credentials
    embeddingDeploymentName: ${incoming.body.embeddingDeploymentName}
    embeddingTargetUri: ${incoming.body.embeddingTargetUri}
    embeddingAzureApiKey: ${incoming.body.embeddingAzureApiKey}
    deploymentEnvironment: ${incoming.body.deploymentEnvironment}
    cookie: ${incoming.headers.cookie}
  next: check_provider

check_provider:
  switch:
    - condition: ${llmPlatform == "aws"}
      next: execute_aws_request
    - condition: ${llmPlatform == "azure"}
      next: execute_azure_request
  next: assign_fail_response

execute_aws_request:
  call: http.post
  args:
    url: "[#RAG_SEARCH_CRON_MANAGER]/execute/store_in_vault/store_secrets"
    query:
      cookie: ${incoming.headers.cookie.replace('customJwtCookie=','')} #Removing the customJwtCookie phrase from payload to to send cookie token only
      vaultUuid: ${vaultUuid}
      llmPlatform: ${llmPlatform}
      llmModel: ${llmModel}
      secretKey: ${secretKey}
      accessKey: ${accessKey}
      embeddingModel: ${embeddingModel}
      embeddingPlatform: ${embeddingPlatform}
      # Embedding AWS Bedrock credentials
      embeddingAccessKey: ${embeddingAccessKey}
      embeddingSecretKey: ${embeddingSecretKey}
      deploymentEnvironment: ${deploymentEnvironment}
  result: cron_aws_res
  next: return_aws_ok

execute_azure_request:
  call: http.post
  args:
    url: "[#RAG_SEARCH_CRON_MANAGER]/execute/store_in_vault/store_secrets"
    query:
      cookie: ${incoming.headers.cookie.replace('customJwtCookie=','')} #Removing the customJwtCookie phrase from payload to to send cookie token only
      vaultUuid: ${vaultUuid}
      llmPlatform: ${llmPlatform}
      llmModel: ${llmModel}
      deploymentName: ${deploymentName}
      targetUrl: ${targetUrl}
      apiKey: ${apiKey}
      embeddingModel: ${embeddingModel}
      embeddingPlatform: ${embeddingPlatform}
      # Embedding Azure credentials
      embeddingDeploymentName: ${embeddingDeploymentName}
      embeddingTargetUri: ${embeddingTargetUri}
      embeddingAzureApiKey: ${embeddingAzureApiKey}
      deploymentEnvironment: ${deploymentEnvironment}
  result: cron_azure_res
  next: return_azure_ok

assign_fail_response:
  assign:
    format_bad_res: {
      message: 'Platform not supported',
      operationSuccessful: false,
      statusCode: 400
    }
  next: return_bad_request

return_aws_ok:
  status: 200
  return: "Executed cron manager successfully to store aws secrets"
  next: end

return_azure_ok:
  status: 200
  return: "Executed cron manager successfully to store azure secrets"
  next: end

return_bad_request:
  status: 400
  return: ${format_bad_res}
  next: end
