declaration:
  call: declare
  version: 0.1
  description: "Get LLM models by platform"
  method: get
  accepts: query
  returns: json
  namespace: rag-search

get_llm_models:
  call: http.post
  args:
    url: "[#RAG_SEARCH_RESQL]/get-llm-models"
  result: models_result
  next: return_success

return_success:
  return: ${models_result.response.body}
  status: 200
  next: end