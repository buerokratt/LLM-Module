enabled: true

# Agent configuration
agent:
  # Port where agent listens for API requests from CronManager
  port: 8203
  
  # Token TTL for CronManager
  tokenTTL: "30m"
  
  # production vault address
  vaultAddress: "http://vault-central.central-vault.svc.cluster.local:8200"

  # From the AppRole Secret mounted by the consuming Deployment.
  credentialsPath: "/vault/approle"
  roleIdFile: "role_id"
  secretIdFile: "secret_id"

  # Token cache location (separate volume for CronManager)
  tokenPath: "/agent/cron-token"
