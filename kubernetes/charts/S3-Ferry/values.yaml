replicas: 1

release_name: "s3-ferry"

image:
  registry: "ghcr.io"
  repository: "buerokratt/s3-ferry"
  pullPolicy: IfNotPresent
  # v1.1.3 reads the keyed S3_DEFAULT_* env names (PRE-ALPHA-1.1.1 read legacy S3_*)
  tag: "v1.1.3"

nameOverride: ""
fullnameOverride: ""

port: 3000

service:
  type: ClusterIP
  port: 3006
  targetPort: 3000


persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  outputDatasets:
    size: 5Gi
  shared:
    size: 2Gi
  cronData:
    size: 3Gi

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Environment variables (non-sensitive)
env:
  API_CORS_ORIGIN: "*"
  API_DOCUMENTATION_ENABLED: "true"
  S3_DEFAULT_REGION: "eu-west-1"
  S3_DEFAULT_ENDPOINT_URL: "http://seaweedfs:8333"
  S3_DEFAULT_DATA_BUCKET_PATH: "resources"
  S3_DEFAULT_DATA_BUCKET_NAME: "rag-search"
  S3_DEFAULT_FS_DATA_DIRECTORY_PATH: "/app"
  GF_USERS_ALLOW_SIGN_UP: "false"
  PORT: "3000"

# Reference to Kubernetes Secret 
envFrom:
  - secretRef:
      name: s3-ferry-secrets



