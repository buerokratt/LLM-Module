{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Values.release_name }}"
  labels:
    app: "{{ .Values.release_name }}"
    component: langfuse-worker
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: "{{ .Values.release_name }}"
  template:
    metadata:
      labels:
        app: "{{ .Values.release_name }}"
        component: langfuse-worker
    spec:
      initContainers:
        - name: wait-for-redis-store
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              echo "Waiting for {{ .Values.env.REDIS_HOST }} on port {{ .Values.env.REDIS_PORT }}..."
              until nc -z {{ .Values.env.REDIS_HOST }} {{ .Values.env.REDIS_PORT }} 2>/dev/null; do
                echo "Redis-compatible store not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "Redis-compatible store is ready."
      containers:
        - name: "{{ .Values.release_name }}"
          image: "{{ .Values.images.langfuse_worker.registry }}/{{ .Values.images.langfuse_worker.repository }}:{{ .Values.images.langfuse_worker.tag }}"
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports:
            - name: worker
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # Non-sensitive env's from values.yaml
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          # Sensitive env's from Kubernetes Secret
          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}
          {{- if .Values.healthcheck.enabled }}
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthcheck.periodSeconds }}
            timeoutSeconds: {{ .Values.healthcheck.timeoutSeconds }}
            failureThreshold: {{ .Values.healthcheck.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthcheck.periodSeconds }}
            timeoutSeconds: {{ .Values.healthcheck.timeoutSeconds }}
            failureThreshold: {{ .Values.healthcheck.failureThreshold }}
          {{- end }}
          resources:
            requests:
              memory: "{{ .Values.resources.requests.memory }}"
              cpu: "{{ .Values.resources.requests.cpu }}"
            limits:
              memory: "{{ .Values.resources.limits.memory }}"
              cpu: "{{ .Values.resources.limits.cpu }}"
      restartPolicy: Always
{{- end }}