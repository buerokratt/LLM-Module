apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.release_name }}
  labels:
    app: {{ .Values.release_name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.release_name }}
  template:
    metadata:
      labels:
        app: {{ .Values.release_name }}
    spec:
      containers:
      - name: {{ .Values.release_name }}
        image: "{{ .Values.notifications.image.repository }}:{{ .Values.notifications.image.tag }}"
        imagePullPolicy: {{ .Values.notifications.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.notifications.port }}
          protocol: TCP
        env:
        # Node.js application configuration
        - name: NODE_ENV
          value: {{ .Values.notifications.nodeEnv | quote }}
        - name: PORT
          value: {{ .Values.notifications.port | quote }}
        - name: REFRESH_INTERVAL
          value: {{ .Values.notifications.refreshInterval | quote }}
        
        # OpenSearch configuration
        {{- if .Values.notifications.opensearch.enabled }}
        - name: OPENSEARCH_PROTOCOL
          value: {{ .Values.notifications.opensearch.protocol | quote }}
        - name: OPENSEARCH_HOST
          value: {{ .Values.notifications.opensearch.host | quote }}
        - name: OPENSEARCH_PORT
          value: {{ .Values.notifications.opensearch.port | quote }}
        - name: OPENSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: notifications-env-secret
              key: OPENSEARCH_USERNAME
        - name: OPENSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: notifications-env-secret
              key: OPENSEARCH_PASSWORD
        {{- end }}
        
        # CORS configuration
        - name: CORS_WHITELIST_ORIGINS
          value: {{ .Values.notifications.cors.whitelistOrigins | quote }}
        
        # BYK Stack integration
        - name: RUUTER_URL
          value: {{ .Values.notifications.services.ruuterUrl | quote }}
        
        resources:
          limits:
            cpu: {{ .Values.notifications.resources.limits.cpu }}
            memory: {{ .Values.notifications.resources.limits.memory }}
          requests:
            cpu: {{ .Values.notifications.resources.requests.cpu }}
            memory: {{ .Values.notifications.resources.requests.memory }}
      
      restartPolicy: Always