apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-llm-config
  labels:
    app: vault-agent-llm
    component: vault-agent
data:
  agent.hcl: |
    vault {
      address = "{{ .Values.agent.vaultAddress }}"
      retry {
        num_retries = 5
      }
    }

    auto_auth {
      method "approle" {
        mount_path = "auth/approle"
        config = {
          role_id_file_path   = "{{ .Values.agent.credentialsPath }}/{{ .Values.agent.roleIdFile }}"
          secret_id_file_path = "{{ .Values.agent.credentialsPath }}/{{ .Values.agent.secretIdFile }}"
          remove_secret_id_file_after_reading = false
        }
      }

      # Keep: the orchestration service reads this token file directly.
      sink "file" {
        config = {
          path = "{{ .Values.agent.tokenPath }}/token"
          mode = 0640
        }
      }
    }

    cache {
      default_lease_duration = "{{ .Values.agent.tokenTTL }}"  # Longer TTL for LLM service
    }

    listener "tcp" {
      address     = "0.0.0.0:{{ .Values.agent.port }}"  # Listen on all interfaces
      tls_disable = true
    }

    api_proxy {
      use_auto_auth_token = true
    }