# Vault Agent LLM: sidecar in the LLM-Orchestration-Service pod (ConfigMap only).

enabled: true

# Agent configuration
agent:
  # Port where agent listens for API requests from the orchestration service
  port: 8201

  # Token TTL for the orchestration service (longest of the three)
  tokenTTL: "1h"

  # PLACEHOLDER: production vault address
  vaultAddress: "http://vault-central.central-vault.svc.cluster.local:8200"

  # From the AppRole Secret mounted by the consuming Deployment.
  credentialsPath: "/vault/approle"
  roleIdFile: "role_id"
  secretIdFile: "secret_id"

  # Token sink; read directly by the orchestration service.
  tokenPath: "/agent/llm-token"
