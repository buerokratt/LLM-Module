{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: dragonfly-secrets
  labels:
    app: "{{ .Values.release_name }}"
    component: dragonfly
type: Opaque
stringData:
  # Dragonfly password, read by Dragonfly and the LLM service. Langfuse keeps a copy
  # in its own secrets as REDIS_AUTH, which must hold the same value.
  DRAGONFLY_PASSWORD: "<SET_ME>"
{{- end }}
