{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: dragonfly-secrets
  labels:
    app: "{{ .Values.release_name }}"
    component: dragonfly
type: Opaque
stringData:
  # One password for Dragonfly, the LLM service and Langfuse (they all read this Secret)
  REDIS_AUTH: "<SET_ME>"
{{- end }}
