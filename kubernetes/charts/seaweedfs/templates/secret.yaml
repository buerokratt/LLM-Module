{{- $identity := dict "name" "rag-admin" "credentials" (list (dict "accessKey" .Values.auth.accessKey "secretKey" .Values.auth.secretKey)) "actions" (list "Admin" "Read" "Write" "List" "Tagging") }}
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-secrets
  labels:
    app: "{{ .Values.release_name }}"
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: {{ .Values.auth.accessKey | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.auth.secretKey | quote }}
  # SeaweedFS identities file, mounted at /etc/seaweedfs/s3.json
  s3.json: {{ dict "identities" (list $identity) | toJson | quote }}
