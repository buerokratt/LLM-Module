      tag: sha-1331462
      pullPolicy: Always
    
    # React application configuration
    nodeEnv: production
    port: 3001
    debugEnabled: true
    enableHiddenFeatures: false
    notifications:
      apiUrl: ""
      # Must match the public key configured on the notifications service.
      vapidPublicKey: "BGtr18_RnioZdJqSdhw3tHEKwklwzm-er3gnHWYolmx0GW-WhAhT-xu46acxbhRZN3_JTyqkFJPI8kFLkyONsGs"
    
