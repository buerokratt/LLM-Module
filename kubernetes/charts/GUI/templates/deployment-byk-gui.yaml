{{- if .Values.gui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.gui.release_name }}
  labels:
    app: {{ .Values.gui.release_name }}
spec:
  replicas: {{ .Values.gui.replicas  }}
  selector:
    matchLabels:
      app: {{ .Values.gui.release_name }}
  template:
    metadata:
      labels:
        app: {{ .Values.gui.release_name }}
        
    spec:
      containers:
      # sidecar: GUI connects to localhost:8202 (vault-agent)
      {{- if .Values.vaultAgent.enabled }}
      - name: vault-agent-gui
        image: hashicorp/vault:1.20.3
        command: ["vault", "agent", "-config=/agent/config/gui-agent.hcl", "-log-level=info"]
        ports:
        - name: agent-api
          containerPort: 8202
          protocol: TCP
        volumeMounts:
        - name: vault-agent-config
          mountPath: /agent/config
          readOnly: true
        - name: vault-agent-creds
          mountPath: /agent/credentials
          readOnly: true
        - name: vault-agent-gui-token
          mountPath: /agent/gui-token
        securityContext:
          capabilities:
            add: ["IPC_LOCK"]
        # # Health check: Ensure token file exists and is not empty
        # livenessProbe:
        #   exec:
        #     command:
        #     - sh
        #     - -c
        #     - test -f /agent/gui-token/token && test -s /agent/gui-token/token
        #   initialDelaySeconds: 10
        #   periodSeconds: 10
        #   timeoutSeconds: 3
        #   failureThreshold: 3
        # readinessProbe:
        #   exec:
        #     command:
        #     - sh
        #     - -c
        #     - test -f /agent/gui-token/token && test -s /agent/gui-token/token
        #   initialDelaySeconds: 5
        #   periodSeconds: 5
        #   timeoutSeconds: 3
      {{- end }}
      - name: {{ .Values.gui.release_name }}
        image: "{{ .Values.gui.image.repository }}:{{ .Values.gui.image.tag }}"
        imagePullPolicy: {{ .Values.gui.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.gui.port }}
          protocol: TCP
        env:
        # Node.js environment configuration
        - name: NODE_ENV
          value: {{ .Values.gui.nodeEnv | quote }}
        - name: PORT
          value: {{ .Values.gui.port | quote }}
        - name: DEBUG_ENABLED
          value: {{ .Values.gui.debugEnabled | quote }}
        - name: CHOKIDAR_USEPOLLING
          value: "true"
        
        # React application configuration
        - name: REACT_APP_RUUTER_API_URL
          value: {{ .Values.gui.services.ruuterPublic | quote }}
        - name: REACT_APP_RUUTER_PRIVATE_API_URL
          value: {{ .Values.gui.services.ruuterPrivate | quote }}
        - name: REACT_APP_EXTERNAL_API_URL
          value: {{ .Values.gui.services.datasetGenerator | quote }}
        - name: REACT_APP_NOTIFICATION_NODE_URL
          value: {{ .Values.gui.services.notificationNode | quote }}
        - name: REACT_APP_CSP
          value: {{ .Values.gui.csp | quote }}
        - name: REACT_APP_SERVICE_ID
          value: {{ .Values.gui.serviceId | quote }}
        - name: REACT_APP_ENABLE_HIDDEN_FEATURES
          value: {{ .Values.gui.enableHiddenFeatures | quote | upper }}
        
        {{- if .Values.vaultAgent.enabled }}
        # Vault Agent proxy URL (localhost sidecar)
        - name: VAULT_AGENT_URL
          value: "http://localhost:8202"
        {{- end }}

        # Vite development server configuration
        - name: VITE_HOST
          value: {{ .Values.gui.vite.host | quote }}
        - name: VITE_ALLOWED_HOSTS
          value: {{ .Values.gui.vite.allowedHosts | quote }}
        
        volumeMounts:
        - name: vite-config
          mountPath: /app/vite.config.ts
          subPath: vite.config.ts
        
        resources:
          limits:
            cpu: {{ .Values.gui.resources.limits.cpu }}
            memory: {{ .Values.gui.resources.limits.memory }}
          requests:
            cpu: {{ .Values.gui.resources.requests.cpu }}
            memory: {{ .Values.gui.resources.requests.memory }}

        # livenessProbe:
        #   httpGet:
        #     path: /
        #     port: {{ .Values.gui.port }}
        #   initialDelaySeconds: 30
        #   periodSeconds: 10
        #   timeoutSeconds: 5
        
        # readinessProbe:
        #   httpGet:
        #     path: /
        #     port: {{ .Values.gui.port }}
        #   initialDelaySeconds: 10
        #   periodSeconds: 5
        #   timeoutSeconds: 3
      
      volumes:
      - name: vite-config
        configMap:
          name: {{ .Values.gui.release_name }}-vite-config
      {{- if .Values.vaultAgent.enabled }}
      # Vault Agent configuration (from Vault-Agent-GUI chart)
      - name: vault-agent-config
        configMap:
          name: vault-agent-gui-config
      # Shared AppRole credentials (created by vault-init Job)
      - name: vault-agent-creds
        persistentVolumeClaim:
          claimName: vault-agent-creds
      # GUI-specific token storage (pod-scoped, short-lived)
      # Tokens are generated by Vault Agent and destroyed when pod terminates
      - name: vault-agent-gui-token
        emptyDir: {}
      {{- end }}
      
      restartPolicy: Always

{{- end }}