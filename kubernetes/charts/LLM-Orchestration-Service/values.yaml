replicas: 1
enabled: true

images:
  llmOrchestration:
    repository: "ghcr.io/buerokratt/llm-orchestration-service"  # Update with actual llm-orchestration image repository
    tag: "latest"
    pullPolicy: "IfNotPresent"

release_name: "llm-orchestration-service"

service:
  type: ClusterIP
  port: 8100
  targetPort: 8100

app:
  environment: "production"

# Volume configurations
volumes:
  # Runtime-generated config volume (managed by InitContainer + PVC)
  config:
    enabled: true
    mountPath: "/app/src/llm_config_module/config"
    size: "1Gi"
    accessMode: "ReadWriteOnce"
    storageClass: ""
  
  # Runtime-generated optimization modules (managed by InitContainer + PVC)
  optimization:
    enabled: true
    mountPath: "/app/src/optimization/optimized_modules"
    size: "5Gi"
    accessMode: "ReadWriteOnce"
    storageClass: ""
  
  # Logs volume (persistent)
  logs:
    enabled: true
    mountPath: "/app/logs"
    size: "5Gi"
    accessMode: "ReadWriteOnce"
    storageClass: ""
  

# InitContainer configuration for runtime volume preparation
initContainer:
  enabled: true
  image: 
    repository: "ghcr.io/buerokratt/llm-orchestration-service"  # Update with actual llm-orchestration image repository
    tag: "latest"
    pullPolicy: "IfNotPresent"
  # InitContainer will prepare the runtime volumes
  prepareVolumes: true

resources:
  requests:
    memory: "256Mi"
    cpu: "50m"
  limits:
    memory: "1Gi"
    cpu: "500m"

healthcheck:
  enabled: false
  initialDelaySeconds: 40
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3
  successThreshold: 1
  # LLM orchestration health endpoint
  httpPath: "/health"
  # Additional readiness checks
  readinessPath: "/ready"

# Environment variables injected into the LLM container
# Redis defaults match the in-cluster Redis service (see Redis chart)
env:
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_AUTH: "myredissecret"
  REDIS_SESSION_DB: "0"
  VAULT_AGENT_PROXY: "true"
  TOOL_CLASSIFIER_ENABLED: "true"
  SERVICE_WORKFLOW_ENABLED: "true"
  API_TOOL_CALLING_WORKFLOW_ENABLED: "true"
  CONTEXT_WORKFLOW_ENABLED: "true"
  MULTI_INTENT_ENABLED: "true"

# Vault Agent sidecar configuration
# WHY: LLM Orchestration needs read access to encrypted LLM API keys
# Security: Agent enforces policy - read-only access to LLM secrets
vaultAgent:
  enabled: true