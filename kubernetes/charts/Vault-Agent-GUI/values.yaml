# Vault Agent GUI Configuration

enabled: true

# Agent configuration
agent:
  # Port where agent listens for API requests from GUI
  port: 8202
  
  # Token TTL for GUI (short-lived)
  tokenTTL: "15m"
  
  # PLACEHOLDER: production vault address
  vaultAddress: "http://vault-central.central-vault.svc.cluster.local:8200"

  # From the AppRole Secret mounted by the consuming Deployment.
  credentialsPath: "/vault/approle"
  roleIdFile: "role_id"
  secretIdFile: "secret_id"

  # Token cache location (separate volume for GUI)
  tokenPath: "/agent/gui-token"
