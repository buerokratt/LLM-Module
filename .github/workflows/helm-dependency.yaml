name: Helm Dependency Build

on:
  push:
    branches:
      - dev
      - main
    paths: 
      - 'kubernetes/**'

jobs:
  build-dependencies:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true 

    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.12.0  

    - name: Build Helm dependencies
      working-directory: ./kubernetes
      run: |
        rm -f Chart.lock
        helm dependency build

    - name: Commit and push if dependencies updated
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add kubernetes/Chart.lock kubernetes/charts/
        if ! git diff --cached --quiet; then
          git commit -m "chore: update Helm dependencies (charts/ and Chart.lock) [skip ci]"
          git push
        else
          echo "No changes to Helm dependencies."
        fi
