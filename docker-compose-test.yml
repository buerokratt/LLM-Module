services:
  # === Core Infrastructure ===
  
  # Shared PostgreSQL database (used by both application and Langfuse)
  rag-search-db:
    image: postgres:14.1
    container_name: rag-search-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dbadmin
      POSTGRES_DB: rag-search
    volumes:
      - test_rag_search_db:/var/lib/postgresql/data
    ports:
      - "5436:5432"
    networks:
      - test-network
  
  # Ruuter Private - API gateway for private endpoint
  ruuter-private:
    container_name: ruuter-private
    image: ghcr.io/buerokratt/ruuter:v2.2.8
    environment:
      - application.cors.allowedOrigins=http://localhost:8088,http://localhost:3001,http://localhost:3003,http://localhost:3004,http://localhost:8080,http://localhost:8000,http://localhost:8090
      - application.httpCodesAllowList=200,201,202,204,400,401,403,500
      - application.internalRequests.allowedIPs=127.0.0.1
      - application.logging.displayRequestContent=true
      - application.logging.displayResponseContent=true
      - application.logging.printStackTrace=true
      - application.internalRequests.disabled=true
      - server.port=8088
    volumes:
      - ./DSL/Ruuter.private:/DSL
      - ./constants.ini:/app/constants.ini
    ports:
      - 8088:8088
    networks:
      - test-network

  # Ruuter Public - API gateway for public endpoints
  ruuter-public:
    container_name: ruuter-public
    image: ghcr.io/buerokratt/ruuter:v2.2.8
    environment:
      - application.cors.allowedOrigins=http://localhost:8086,http://localhost:3001,http://localhost:3003,http://localhost:3004,http://localhost:8080,http://localhost:8000,http://localhost:8090
      - application.httpCodesAllowList=200,201,202,204,400,401,403,500
      - application.internalRequests.allowedIPs=127.0.0.1
      - application.logging.displayRequestContent=true
      - application.logging.displayResponseContent=true
      - application.logging.printStackTrace=true
      - application.internalRequests.disabled=true
      - server.port=8086
    volumes:
      - ./DSL/Ruuter.public:/DSL
      - ./constants.ini:/app/constants.ini
    ports:
      - 8086:8086
    networks:
      - test-network

  # Cron-Manager - Scheduled job execution for vector indexing
  cron-manager:
    container_name: cron-manager
    image: ghcr.io/buerokratt/cronmanager:python-1.2.0
    user: "root"
    volumes:
      - ./DSL/CronManager/DSL:/DSL
      - ./DSL/CronManager/script:/app/scripts
      - ./constants.ini:/app/config/constants.ini:ro  # service endpoint URLs (NOT /app/constants.ini - that one is baked into the image)
      - ./src/vector_indexer:/app/src/vector_indexer
      - ./src/constants_loader.py:/app/src/constants_loader.py:ro  # reads /app/config/constants.ini
      - ./datasets:/app/datasets
      - ./grafana-configs/loki_logger.py:/app/src/vector_indexer/loki_logger.py
      - ./test-vault/agent-out:/agent/out:ro
    environment:
      - server.port=9010
      - PYTHONPATH=/app:/app/src:/app/src/vector_indexer
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN_FILE=/agent/out/token
    ports:
      - 9010:8080
    depends_on:
      - vault-agent-llm
      - vault
    networks:
      - test-network

  # Resql - SQL-based microservice for RAG operations
  resql:
    container_name: resql
    image: ghcr.io/buerokratt/resql:v1.3.6
    depends_on:
      rag-search-db:
        condition: service_started
    environment:
      - sqlms.datasources.[0].name=byk
      - sqlms.datasources.[0].jdbcUrl=jdbc:postgresql://rag-search-db:5432/rag-search #For LocalDb Use
      # sqlms.datasources.[0].jdbcUrl=jdbc:postgresql://171.22.247.13:5435/byk?sslmode=require
      - sqlms.datasources.[0].username=postgres
      - sqlms.datasources.[0].password=dbadmin
      - logging.level.org.springframework.boot=INFO
    ports:
      - 8082:8082
    volumes:
      - ./DSL/Resql:/DSL
      - ./shared:/shared
      - ./DSL/DatasetGenerator/output_datasets:/app/output_datasets
    networks:
      - test-network

  # Vector database for RAG
  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - test_qdrant_data:/qdrant/storage
    networks:
      - test-network

  # === Secret Management ===
  
  # Vault - Secret management (dev mode)
  vault:
    image: hashicorp/vault:1.20.3
    container_name: vault
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://0.0.0.0:8200
    command: server -dev -dev-listen-address=0.0.0.0:8200
    networks:
      - test-network

  # Vault Agent - Automatic token management via AppRole
  vault-agent-llm:
    image: hashicorp/vault:1.20.3
    container_name: vault-agent-llm
    depends_on:
      - vault
    volumes:
      - ./test-vault/agents/llm:/agent/in
      - ./test-vault/agent-out:/agent/out
      # agent.hcl writes the token/pidfile/dummy to /agent/llm-token; map it to the
      # same host dir as /agent/out so the host and other services see the token.
      - ./test-vault/agent-out:/agent/llm-token
    entrypoint: ["sh", "-c"]
    command:
      - |
        # Wait for Vault to be ready
        sleep 5
        echo "Waiting for AppRole credentials..."
        while [ ! -f /agent/in/role_id ] || [ ! -s /agent/in/role_id ]; do
          sleep 1
        done
        while [ ! -f /agent/in/secret_id ] || [ ! -s /agent/in/secret_id ]; do
          sleep 1
        done
        echo "Credentials found, starting Vault Agent..."
        exec vault agent -config=/agent/in/agent.hcl -log-level=debug
    networks:
      - test-network

  # === Langfuse Observability Stack ===
  
  # Dragonfly: Langfuse queues (db 0) and app sessions (db 1)
  dragonfly:
    image: ghcr.io/dragonflydb/dragonfly:v2.0.2
    container_name: dragonfly
    restart: always
    # No password: CI-only throwaway container, port bound to localhost
    command:
      - --logtostderr
      - --maxmemory=512mb
      - --proactor_threads=2
      # Option A: Langfuse's BullMQ Lua scripts use keys they don't declare
      - --default_lua_flags=allow-undeclared-keys
    ulimits:
      memlock: -1
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-network

  # SeaweedFS - S3-compatible storage for Langfuse and the integration tests
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: seaweedfs
    restart: always
    command: server -filer -s3 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    configs:
      - source: seaweedfs_s3_identities
        target: /etc/seaweedfs/s3.json
    ports:
      - "9000:8333"   # tests connect to localhost:9000 (see conftest.py)
      - "127.0.0.1:8888:8888"
    volumes:
      - test_seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9333/cluster/status && wget -q --spider http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - test-network

  # Creates the Langfuse bucket (replaces MinIO's mkdir /data/langfuse)
  seaweedfs-init:
    image: rclone/rclone:1.68.2
    container_name: seaweedfs-init
    command: ["mkdir", "seaweedfs:langfuse", "-v"]
    environment:
      RCLONE_CONFIG_SEAWEEDFS_TYPE: s3
      RCLONE_CONFIG_SEAWEEDFS_PROVIDER: SeaweedFS
      RCLONE_CONFIG_SEAWEEDFS_ENDPOINT: http://seaweedfs:8333
      RCLONE_CONFIG_SEAWEEDFS_ACCESS_KEY_ID: seaweedfs-test
      RCLONE_CONFIG_SEAWEEDFS_SECRET_ACCESS_KEY: seaweedfs-test-secret
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"
    networks:
      - test-network

  # ClickHouse - Analytics database for Langfuse (REQUIRED in v3)
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    restart: always
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - test_clickhouse_data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9002:9000"
    networks:
      - test-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # Langfuse Worker - Background job processor
  langfuse-worker:
    image: langfuse/langfuse-worker:3.225.2
    container_name: langfuse-worker
    restart: always
    depends_on:
      rag-search-db:
        condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully
      dragonfly:
        condition: service_healthy
      clickhouse:
        condition: service_started
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:dbadmin@rag-search-db:5432/rag-search
      
      # Auth & Security (TEST VALUES ONLY - NOT FOR PRODUCTION)
      # gitleaks:allow - These are test-only hex strings
      NEXTAUTH_URL: http://localhost:3000
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      
      # Features
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      
      # ClickHouse (REQUIRED for Langfuse v3)
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000/default
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      
      # S3 (SeaweedFS) Event Upload
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: seaweedfs-test
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: seaweedfs-test-secret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs:8333
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      
      # S3 (SeaweedFS) Media Upload
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: seaweedfs-test
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: seaweedfs-test-secret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://seaweedfs:8333
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      
      # Langfuse's own setting names (REDIS_*), pointed at Dragonfly
      REDIS_HOST: dragonfly
      REDIS_PORT: "6379"
    networks:
      - test-network

  # Langfuse Web - UI and API
  langfuse-web:
    image: langfuse/langfuse:3.225.2
    container_name: langfuse-web
    restart: always
    depends_on:
      - langfuse-worker
      - rag-search-db
      - clickhouse
    ports:
      - "3000:3000"
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:dbadmin@rag-search-db:5432/rag-search
      
      # Auth & Security (TEST VALUES ONLY - NOT FOR PRODUCTION)
      # gitleaks:allow - These are test-only hex strings
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      
      # Features
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      
      # ClickHouse (REQUIRED for Langfuse v3)
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000/default
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      
      # S3 (SeaweedFS) Event Upload
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: seaweedfs-test
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: seaweedfs-test-secret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs:8333
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      
      # S3 (SeaweedFS) Media Upload
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: seaweedfs-test
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: seaweedfs-test-secret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://seaweedfs:8333
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      
      # Langfuse's own setting names (REDIS_*), pointed at Dragonfly
      REDIS_HOST: dragonfly
      REDIS_PORT: "6379"
      
      # Initialize test project with known credentials
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-test
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-test
    networks:
      - test-network

  # === LLM Orchestration Service ===
  
  llm-orchestration-service:
    build:
      context: .
      dockerfile: Dockerfile.llm_orchestration_service
    container_name: llm-orchestration-service
    restart: always
    ports:
      - "8100:8100"
    environment:
      # Infrastructure connections
      # the test agent runs with api_proxy disabled (test-vault/agents/llm/agent.hcl),
      - VAULT_ADDR=http://vault:8200

      - VAULT_TOKEN_FILE=/agent/llm-token/token
      - QDRANT_URL=http://qdrant:6333
      - EVAL_MODE=true
      # Disable OpenTelemetry tracing in test environment
      - OTEL_SDK_DISABLED=true
      # Session store: Dragonfly db 1 (Langfuse uses db 0)
      - DRAGONFLY_HOST=dragonfly
      - DRAGONFLY_PORT=6379
      - DRAGONFLY_SESSION_DB=1
    volumes:
      - ./src/llm_config_module/config:/app/src/llm_config_module/config:ro
      - ./test-vault/agent-out:/agent/llm-token:ro
      - test_llm_orchestration_logs:/app/logs
    depends_on:
      - qdrant
      - langfuse-web
      - vault-agent-llm
      - dragonfly
    networks:
      - test-network

# === Networks ===

networks:
  test-network:
    name: test-network
    driver: bridge

# === Volumes ===

volumes:
  test_rag_search_db:
    name: test_rag_search_db
  test_qdrant_data:
    name: test_qdrant_data
  test_seaweedfs_data:
    name: test_seaweedfs_data
  test_clickhouse_data:
    name: test_clickhouse_data
  test_llm_orchestration_logs:
    name: test_llm_orchestration_logs
# === Configs ===

# SeaweedFS S3 login (TEST VALUES ONLY - NOT FOR PRODUCTION)
configs:
  seaweedfs_s3_identities:
    content: |
      {"identities":[{"name":"test-admin","credentials":[{"accessKey":"seaweedfs-test","secretKey":"seaweedfs-test-secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
