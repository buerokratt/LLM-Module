server {
    server_name localhost;
    listen 3001; # replace port depends on deploy environment

    server_tokens off;
    add_header Access-Control-Allow-Origin *;

    location / {
      root /usr/share/nginx/html/rag-search;
      try_files $uri /index.html;
    }

    # Expose only the public encryption-key read through the colocated Agent.
    location ~ ^/vault-agent-gui/v1/[A-Za-z0-9_-]+/data/([A-Za-z0-9_-]+/)+encryption/public_key$ {
      limit_except GET { deny all; }
      rewrite ^/vault-agent-gui(/v1/.*)$ $1 break;
      proxy_set_header X-Vault-Token "";
      proxy_pass http://127.0.0.1:8202;
    }
    location /vault-agent-gui/ { return 404; }

    location /status {
      access_log off;
      default_type text/plain;
      add_header Content-Type text/plain;
      return 200 "alive";
    }

    location /vault-agent-gui/ {
      proxy_pass http://127.0.0.1:8202/;
    }

    rewrite ^/$ http://$host:$server_port/rag-search permanent; # replace port depends on deploy environment
}
