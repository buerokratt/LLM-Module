[project]
name = "rag-module"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.10"
dependencies = [
    "azure-identity>=1.24.0",
    "azure-storage-blob>=12.24.0",
    "boto3>=1.40.25",
    "dspy>=3.0.3",
    "openai>=1.106.1",
    "numpy>=2.3.2",
    "pre-commit>=4.3.0",
    "pyright>=1.1.407",
    "pytest>=8.4.1",
    "pyyaml>=6.0.2",
    "ruff>=0.12.12",
    "python-dotenv>=1.1.1",
    "loguru>=0.7.3",
    "requests>=2.32.5",
    "pydantic>=2.11.7",
    "testcontainers>=4.13.0",
    "hvac>=2.3.0",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "qdrant-client>=1.15.1",
    "rank-bm25>=0.2.2",
    "deepeval>=3.6.0",
    "deepteam>=0.2.5",
    "rerankers>=0.10.0",
    "deepeval>=3.6.0",
    "pytest-json-report>=1.5.0",
    "deepteam>=0.2.5",
    "anthropic>=0.69.0",
    "nemoguardrails>=0.16.0",
    "tiktoken>=0.11.0",
    "langfuse>=3.8.1",
    "minio>=7.2.0",
    "psycopg2-binary>=2.9.11",
    "redis[hiredis]>=5.0,<6.0",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black Formatter.
line-length = 88
indent-width = 4

# Set Python Version - 3.12
target-version = "py312"

fix = false


[tool.ruff.lint]


select = ["E4", "E7", "E9", "F", "B", "T20", "N", "ANN", "ERA", "PERF"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Per-file ignores for special cases
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",    # Ignore all missing type annotations (ANN001, ANN201, etc.)
    "T201",   # Allow print statements
]

"src/models/request_models.py" = ["N815"]  # camelCase fields required for API contract
"src/optimization/optimized_module_loader.py" = ["N815"]  # Pydantic model fields
"src/optimization/optimizers/generator_optimizer.py" = ["N815"]  # Pydantic model fields
"src/response_generator/response_generate.py" = ["N815", "ANN401"]  # Pydantic model fields + DSPy streamify Any type

# Library interface patterns - legitimate Any usage
"src/utils/observation_utils.py" = ["ANN401"]
"src/contextual_retrieval/contextual_retrieval_api_client.py" = ["ANN401"]  # httpx **kwargs pass-through
"src/tool_classifier/workflows/service_workflow.py" = ["ANN401"]  # LLMManager passed as Any - dynamic multi-provider LLM interface
"src/guardrails/dspy_nemo_adapter.py" = ["ANN401"]  # LangChain LLM interface + DSPy dynamic types
"src/tool_classifier/param_extractor.py" = ["ANN401"]  # DSPy streamify Any type
"src/tool_classifier/api_response_formatter.py" = ["ANN401"]  # DSPy streamify Any type
"src/llm_orchestrator_config/context_manager.py" = ["ANN401"]  # MockResponse with dynamic attributes
"src/optimization/metrics/*.py" = ["ANN401"]  # DSPy optimizer trace parameter (internal type)

"byk-stack-setup/script.py" = ["T201"]  # Allow print statements in setup script


"src/utils/api_tool_session_store.py" = ["ANN401"]  # Dynamic Pydantic model field updates via **kwargs
"src/utils/atc_cache_store.py" = ["ANN401"]  # raw_response / return type are parsed JSON (dict or list) — Any is the correct annotation
"src/tool_classifier/workflows/api_tool_workflow.py" = ["ANN401", "N815"]  # Dynamic guardrails adapter + orchestration service Any types; camelCase _MinimalRequest field for API contract

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

docstring-code-format = false
docstring-code-line-length = "dynamic"



[tool.pyright]
# --- Environment & discovery ---
pythonVersion = "3.12.10"          # Target Python semantics (pattern matching, typing features, stdlib types).
venvPath = "."                   # Where virtual envs live relative to repo root.
venv = ".venv"                   # The specific env name uv manages (uv sync creates .venv).

# --- What to analyze ---
include = ["*"]       # Top-level packages & tests to check.
exclude = [
  "**/.venv", "**/__pycache__", "build", "dist", ".git",
  ".ruff_cache", ".mypy_cache", "tests/", "**/tests/"
]

# --- Global strictness ---
typeCheckingMode = "standard"      # Standard typechecking mode